name: Dotfiles CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: bootstrap-install.sh
          ignore_paths: chezmoi-source/dot_config/zsh chezmoi-source/dot_config/fzf-git chezmoi-source/.chezmoiscripts
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091

  chezmoi-templates:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Shellcheck every script template
        run: |
          mkdir -p /tmp/rendered
          for f in chezmoi-source/.chezmoiscripts/*.tmpl; do
            name="$(basename "$f" .tmpl)"
            echo "Rendering $f"
            chezmoi --source . execute-template -f "$f" > "/tmp/rendered/$name"
          done
          shellcheck -e SC1090 -e SC1091 /tmp/rendered/*

      - name: Validate .chezmoiexternal.toml
        run: |
          chezmoi --source . execute-template -f chezmoi-source/.chezmoiexternal.toml.tmpl > /tmp/rendered-external.toml
          python3 -c "import tomllib; tomllib.load(open('/tmp/rendered-external.toml', 'rb'))"

      - name: Dry-run apply
        run: |
          mkdir -p /tmp/chezmoi-ci-home
          chezmoi --source . --destination /tmp/chezmoi-ci-home apply --dry-run
