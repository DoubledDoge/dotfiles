"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
sort_translit = true
linemode = "mtime"
show_hidden = true
show_symlink = true
mouse_events = ["click", "scroll"]

[preview]
wrap = "yes"
image_delay = 3000
image_filter = "lanczos3"

[opener]
play = [
    { run = "haruna %s", block = true, orphan = true, desc = "Open with Haruna" },
]
edit = [
    { run = "$EDITOR %s", block = true, orphan = true, desc = "Open with editor"},
]
open = [
    { run = "xdg-open %s1", block = true, orphan = true, desc = "Open" },
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },

	{ url = "*.json", use = "edit" },

	{ url = "*.html", use = [ "open", "edit" ] },
]

[input]
cursor_blink = true