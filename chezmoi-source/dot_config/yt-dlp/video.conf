-S ",res:1080,fps:60,vcodec:av01,acodec:opus"
-f "bv*+ba/b"
--merge-output-format mkv

--embed-metadata
--embed-thumbnail
--embed-chapters
--embed-subs
--sub-langs "en.*,-live_chat"
--restrict-filenames 

--no-playlist
-P "~/Videos/yt-dlp"
-o "%(title)s [%(id)s].%(ext)s"

--sponsorblock-mark intro outro
--sponsorblock-remove sponsor interaction
--sponsorblock-chapter-title "%(category_names)l"
--sponsorblock-api https://sponsor.ajay.app